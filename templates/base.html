<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Jardín Verde{% endblock %} | Tienda de jardinería</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <header>
        <a class="marca" href="{{ url_for('inicio') }}">Jardín Verde</a>
        <p>Plantas, herramientas y todo para tu jardín</p>
        <nav aria-label="Navegación principal">
            <a href="{{ url_for('inicio') }}">Inicio</a>
            <a href="{{ url_for('listado') }}">Productos</a>
            <a href="{{ url_for('consulta') }}">Consultar</a>
            <a href="{{ url_for('anadir') }}">Añadir producto</a>
            <a href="{{ url_for('resumen') }}">Resumen</a>
            <a href="{{ url_for('reposicion') }}">Reposición</a>
        </nav>
    </header>
    <main>
        {% block contenido %}{% endblock %}
    </main>
    <footer>Jardín Verde · Proyecto de aplicaciones web con Flask</footer>
</body>
</html>
